name: 602AZ GitHub to AWS Deployment Workflow

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Select deployment environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - test
          - prod
      enable_cloudtrail:
        description: Enable optional CloudTrail resources
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  STACK_NAME: infrastructure-reporting-602az
  TEMPLATE_FILE: cloudformation
  EXISTING_BACKEND_FUNCTION: infrastructure-reporting-602az-backend
  PROJECT_PREFIX: infrastructure-reporting-602az

jobs:
  validate:
    name: 1. Validate Repository and CloudFormation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show repository files
        shell: bash
        run: |
          echo "Repository files:"
          find . -maxdepth 3 -type f | sort

      - name: Confirm CloudFormation template exists
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "${TEMPLATE_FILE}" ]; then
            echo "::error::CloudFormation template not found at ${TEMPLATE_FILE}"
            echo "Available files in repository root:"
            ls -la
            exit 1
          fi

          echo "CloudFormation template found: ${TEMPLATE_FILE}"

      - name: Configure AWS learner-lab credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Verify GitHub connection with AWS
        shell: bash
        run: |
          set -euo pipefail
          echo "Testing GitHub Actions connection to AWS..."
          aws sts get-caller-identity
          echo "AWS connection successful."
          echo "AWS Region: ${AWS_REGION}"

      - name: Validate CloudFormation template
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation validate-template \
            --template-body "file://${TEMPLATE_FILE}" \
            --region "${AWS_REGION}"

      - name: Confirm existing Lambda function
        shell: bash
        run: |
          set -euo pipefail
          aws lambda get-function \
            --function-name "${EXISTING_BACKEND_FUNCTION}" \
            --region "${AWS_REGION}" \
            --query "Configuration.[FunctionName,Runtime,State,LastModified]" \
            --output table

  deploy:
    name: 2. Deploy AWS Infrastructure
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS learner-lab credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Deploy CloudFormation stack
        shell: bash
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment }}
          ENABLE_CLOUDTRAIL: ${{ inputs.enable_cloudtrail }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          ALLOWED_CORS_ORIGIN: ${{ vars.ALLOWED_CORS_ORIGIN || '*' }}
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --template-file "${TEMPLATE_FILE}" \
            --stack-name "${STACK_NAME}-${ENVIRONMENT_NAME}" \
            --region "${AWS_REGION}" \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ExistingBackendFunctionName="${EXISTING_BACKEND_FUNCTION}" \
              ProjectPrefix="${PROJECT_PREFIX}" \
              EnvironmentName="${ENVIRONMENT_NAME}" \
              NotificationEmail="${NOTIFICATION_EMAIL}" \
              AllowedCorsOrigin="${ALLOWED_CORS_ORIGIN}" \
              EnablePublicWebsitePolicy="false" \
              EnableCloudTrail="${ENABLE_CLOUDTRAIL}" \
            --tags \
              Project="602AZ-Infrastructure-Reporting" \
              Environment="${ENVIRONMENT_NAME}" \
              ManagedBy="GitHub-Actions" \
              Repository="${GITHUB_REPOSITORY}"

      - name: Show CloudFormation stack status
        shell: bash
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}-${ENVIRONMENT_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].[StackName,StackStatus,CreationTime,LastUpdatedTime]" \
            --output table

      - name: Show deployed AWS resources
        shell: bash
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          aws cloudformation list-stack-resources \
            --stack-name "${STACK_NAME}-${ENVIRONMENT_NAME}" \
            --region "${AWS_REGION}" \
            --query "StackResourceSummaries[].{Resource:LogicalResourceId,Type:ResourceType,Status:ResourceStatus}" \
            --output table

      - name: Show CloudFormation outputs
        shell: bash
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}-${ENVIRONMENT_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[].{Output:OutputKey,Value:OutputValue}" \
            --output table

  verify:
    name: 3. Verify AWS Connection and Resources
    needs: deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Configure AWS learner-lab credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Verify stack and collect outputs
        id: outputs
        shell: bash
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          CURRENT_STACK="${STACK_NAME}-${ENVIRONMENT_NAME}"

          get_output() {
            aws cloudformation describe-stacks \
              --stack-name "${CURRENT_STACK}" \
              --region "${AWS_REGION}" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue | [0]" \
              --output text
          }

          API_BASE_URL="$(get_output ApiBaseUrl)"
          WEBSITE_BUCKET="$(get_output WebsiteBucketName)"
          WEBSITE_URL="$(get_output WebsiteUrl)"
          IMAGE_BUCKET="$(get_output ImageBucketName)"
          REPORTS_TABLE="$(get_output ReportsTableName)"
          DASHBOARD_NAME="$(get_output MonitoringDashboardName)"

          echo "api_base_url=${API_BASE_URL}" >> "${GITHUB_OUTPUT}"
          echo "website_bucket=${WEBSITE_BUCKET}" >> "${GITHUB_OUTPUT}"
          echo "website_url=${WEBSITE_URL}" >> "${GITHUB_OUTPUT}"
          echo "image_bucket=${IMAGE_BUCKET}" >> "${GITHUB_OUTPUT}"
          echo "reports_table=${REPORTS_TABLE}" >> "${GITHUB_OUTPUT}"
          echo "dashboard_name=${DASHBOARD_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Verify existing Lambda function
        shell: bash
        run: |
          set -euo pipefail
          aws lambda get-function \
            --function-name "${EXISTING_BACKEND_FUNCTION}" \
            --region "${AWS_REGION}" \
            --query "Configuration.[FunctionName,Runtime,State,LastModified]" \
            --output table

      - name: Verify DynamoDB table
        shell: bash
        run: |
          set -euo pipefail
          aws dynamodb describe-table \
            --table-name "${{ steps.outputs.outputs.reports_table }}" \
            --region "${AWS_REGION}" \
            --query "Table.[TableName,TableStatus,BillingModeSummary.BillingMode]" \
            --output table

      - name: Verify S3 image bucket protection
        shell: bash
        run: |
          set -euo pipefail
          aws s3api get-bucket-versioning \
            --bucket "${{ steps.outputs.outputs.image_bucket }}" \
            --region "${AWS_REGION}"

          aws s3api get-public-access-block \
            --bucket "${{ steps.outputs.outputs.image_bucket }}" \
            --region "${AWS_REGION}"

      - name: Verify CloudWatch dashboard
        shell: bash
        run: |
          set -euo pipefail
          aws cloudwatch get-dashboard \
            --dashboard-name "${{ steps.outputs.outputs.dashboard_name }}" \
            --region "${AWS_REGION}" \
            --query "DashboardName" \
            --output text

      - name: Test API Gateway connection safely
        shell: bash
        run: |
          set -euo pipefail

          API_URL="${{ steps.outputs.outputs.api_base_url }}"
          TEST_URL="${API_URL}/reports/workflow-connection-test"

          echo "Testing API Gateway connection:"
          echo "${TEST_URL}"

          HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --output api-response.txt \
              --write-out "%{http_code}" \
              --max-time 20 \
              "${TEST_URL}" || true
          )"

          echo "HTTP status: ${HTTP_STATUS}"
          echo "Response:"
          cat api-response.txt || true

          if [ "${HTTP_STATUS}" = "000" ]; then
            echo "::error::GitHub Actions could not reach API Gateway."
            exit 1
          fi

          echo "API Gateway is reachable from GitHub Actions."
          echo "A 4xx or 5xx response may still indicate an application or Lambda issue."

      - name: Create professional workflow summary
        shell: bash
        run: |
          {
            echo "# 602AZ GitHub-to-AWS Deployment Summary"
            echo ""
            echo "## Workflow connection"
            echo "\`GitHub Repository → GitHub Actions → AWS STS → CloudFormation → AWS Resources\`"
            echo ""
            echo "## Verified components"
            echo "- AWS learner-lab authentication"
            echo "- CloudFormation template validation"
            echo "- Existing Lambda function"
            echo "- CloudFormation deployment"
            echo "- API Gateway endpoint"
            echo "- DynamoDB table"
            echo "- S3 website and image buckets"
            echo "- CloudWatch monitoring dashboard"
            echo ""
            echo "## Source-code protection"
            echo "This workflow does not edit the frontend or backend source code."
            echo ""
            echo "## Main outputs"
            echo "- API URL: ${{ steps.outputs.outputs.api_base_url }}"
            echo "- Website URL: ${{ steps.outputs.outputs.website_url }}"
            echo "- Website bucket: ${{ steps.outputs.outputs.website_bucket }}"
            echo "- Image bucket: ${{ steps.outputs.outputs.image_bucket }}"
            echo "- DynamoDB table: ${{ steps.outputs.outputs.reports_table }}"
          } >> "${GITHUB_STEP_SUMMARY}"
